name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  rust-portable:
    name: Rust portable checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libasound2-dev \
            libatk1.0-dev \
            libcairo2-dev \
            libgdk-pixbuf-2.0-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libpango1.0-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            libxkbcommon-dev \
            pkg-config
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.89 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        working-directory: src-tauri
        run: cargo +1.89 fmt --check
      - name: Run portable Rust tests
        working-directory: src-tauri
        run: cargo +1.89 test --lib --no-default-features
      - name: Lint portable Rust target
        working-directory: src-tauri
        run: cargo +1.89 clippy --lib --no-default-features -- -D warnings
      # `custom-protocol` makes Tauri embed the built frontend, so
      # `generate_context!` fails with "frontendDist ... doesn't exist" unless
      # dist/ has been produced first. dist/ is gitignored, so each job that
      # compiles the release target has to build it.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Build the frontend Tauri will embed
        run: npm ci && npm run build
      - name: Compile portable Rust target
        working-directory: src-tauri
        run: cargo +1.89 build --release --no-default-features --features custom-protocol

  rust-macos:
    name: Rust portable checks (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.89 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        working-directory: src-tauri
        run: cargo +1.89 fmt --check
      - name: Run portable Rust tests
        working-directory: src-tauri
        run: cargo +1.89 test --lib --no-default-features
      - name: Lint portable Rust target
        working-directory: src-tauri
        run: cargo +1.89 clippy --lib --no-default-features -- -D warnings
      # `custom-protocol` makes Tauri embed the built frontend, so
      # `generate_context!` fails with "frontendDist ... doesn't exist" unless
      # dist/ has been produced first. dist/ is gitignored, so each job that
      # compiles the release target has to build it.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Build the frontend Tauri will embed
        run: npm ci && npm run build
      - name: Compile portable Rust target
        working-directory: src-tauri
        run: cargo +1.89 build --release --no-default-features --features custom-protocol

  rust-windows:
    name: Rust portable checks (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.89 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        working-directory: src-tauri
        run: cargo +1.89 fmt --check
      - name: Run portable Rust tests
        working-directory: src-tauri
        run: cargo +1.89 test --lib --no-default-features
      - name: Lint portable Rust target
        working-directory: src-tauri
        run: cargo +1.89 clippy --lib --no-default-features -- -D warnings
      # `custom-protocol` makes Tauri embed the built frontend, so
      # `generate_context!` fails with "frontendDist ... doesn't exist" unless
      # dist/ has been produced first. dist/ is gitignored, so each job that
      # compiles the release target has to build it.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Build the frontend Tauri will embed
        run: npm ci && npm run build
      - name: Compile portable Rust target
        working-directory: src-tauri
        run: cargo +1.89 build --release --no-default-features --features custom-protocol

  cuda-linux-nvidia:
    name: CUDA build checks (Linux/NVIDIA)
    # Manual only. This needs a self-hosted GPU runner, and there is none
    # attached — a push-triggered job would just sit in the queue for 24 hours
    # and then report failure, which is how the CUDA gates went unwatched long
    # enough for 30 clippy errors to pile up behind them. Run the same checks
    # locally with `scripts/check-cuda.sh`; re-attach a runner and this job
    # works as written.
    #
    # A self-hosted runner would also execute repository code, unsandboxed, as
    # the runner's user. If one is attached again it should run as a dedicated
    # user and be registered `--ephemeral`, and the fork guard below must stay:
    # without it anyone could fork this public repo and run code on that host.
    if: >-
      github.event_name == 'workflow_dispatch'
      && (github.event.pull_request.head.repo.fork == false || github.event.pull_request == null)
    runs-on: [self-hosted, linux, x64, nvidia-cuda]
    timeout-minutes: 45
    env:
      # A repository variable points only at a runner-local, pinned Parakeet
      # test model. It is intentionally not a user model directory or secret.
      VOXIDE_CUDA_HOME: ${{ vars.VOXIDE_CUDA_HOME }}
      VOXIDE_PARAKEET_MODEL_DIR: ${{ vars.VOXIDE_PARAKEET_MODEL_DIR }}
      VOXIDE_SHERPA_ONNX_LIB_DIR: ${{ vars.VOXIDE_SHERPA_ONNX_LIB_DIR }}
      VOXIDE_PARAKEET_CUDA_LIB_DIRS: ${{ vars.VOXIDE_PARAKEET_CUDA_LIB_DIRS }}
      # Compute capability of the runner's GPU. Overridable so a different GPU
      # does not need a workflow edit; sm_89 is the RTX 40-series default.
      VOXIDE_CMAKE_CUDA_ARCHITECTURES: ${{ vars.VOXIDE_CMAKE_CUDA_ARCHITECTURES }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify NVIDIA/CUDA runner contract
        run: |
          test -x "$VOXIDE_CUDA_HOME/bin/nvcc"
          "$VOXIDE_CUDA_HOME/bin/nvcc" --version
          pkg-config --modversion alsa
          pkg-config --modversion gtk+-3.0
          test -n "$VOXIDE_PARAKEET_MODEL_DIR"
          test -f "$VOXIDE_PARAKEET_MODEL_DIR/test_wavs/en.wav"
          test -d "$VOXIDE_SHERPA_ONNX_LIB_DIR"
          test -n "$VOXIDE_PARAKEET_CUDA_LIB_DIRS"
      - name: Configure CUDA build environment
        run: |
          echo "CUDA_HOME=$VOXIDE_CUDA_HOME" >> "$GITHUB_ENV"
          echo "CUDAToolkit_ROOT=$VOXIDE_CUDA_HOME" >> "$GITHUB_ENV"
          echo "SHERPA_ONNX_LIB_DIR=$VOXIDE_SHERPA_ONNX_LIB_DIR" >> "$GITHUB_ENV"
          echo "PARAKEET_CUDA_LIB_DIRS=$VOXIDE_PARAKEET_CUDA_LIB_DIRS" >> "$GITHUB_ENV"
          echo "$VOXIDE_CUDA_HOME/bin" >> "$GITHUB_PATH"
          # GGML's CUDA backend is compiled by CMake through nvcc, which refuses
          # a host GCC newer than it knows about — the runner is on GCC 16 while
          # nvcc 13.3 caps at 15, so CUDA compiler detection fails outright
          # without this. GGML itself builds fine under GCC 16 once allowed.
          # Pinning the architecture also avoids compiling every other one.
          echo "CMAKE_CUDA_FLAGS=--allow-unsupported-compiler" >> "$GITHUB_ENV"
          echo "CMAKE_CUDA_ARCHITECTURES=${VOXIDE_CMAKE_CUDA_ARCHITECTURES:-89}" >> "$GITHUB_ENV"
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.89 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        working-directory: src-tauri
        run: cargo +1.89 fmt --check
      - name: Audit resolved CUDA dependency graph
        working-directory: src-tauri
        run: cargo +1.89 tree --locked --features cuda --edges normal,build
      - name: Run CUDA Rust lifecycle tests
        working-directory: src-tauri
        run: cargo +1.89 test --lib --features cuda
      - name: Run CUDA model inference fixtures
        working-directory: src-tauri
        run: cargo +1.89 test --lib --features cuda cuda_model -- --ignored
      - name: Lint CUDA Rust target
        working-directory: src-tauri
        run: cargo +1.89 clippy --lib --features cuda -- -D warnings
      # Same reason as the portable jobs: `custom-protocol` embeds dist/, which is
      # gitignored, so `generate_context!` panics unless it is built first.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Build the frontend Tauri will embed
        run: npm ci && npm run build
      - name: Build CUDA release target
        working-directory: src-tauri
        run: cargo +1.89 build --release --features cuda,custom-protocol
