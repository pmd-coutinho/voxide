name: Release

# Tag-triggered so a release is deliberate, plus manual dispatch for dry runs
# against a branch without creating a tag first.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      # One platform failing should not hide whether the others are shippable.
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            runner: ubuntu-24.04
            binary: voxide
            asset: voxide-linux-x86_64
          - label: macOS arm64
            runner: macos-latest
            binary: voxide
            asset: voxide-macos-arm64
          - label: Windows x86_64
            runner: windows-latest
            binary: voxide.exe
            asset: voxide-windows-x86_64.exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libasound2-dev \
            libatk1.0-dev \
            libcairo2-dev \
            libgdk-pixbuf-2.0-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libpango1.0-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            libxkbcommon-dev \
            pkg-config

      # The same toolchain CI gates against, so a release cannot be built by a
      # compiler that never ran the tests.
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.89 --profile minimal

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      # `custom-protocol` embeds dist/, which is gitignored: without this the
      # build fails in `generate_context!`, and a plain cargo build would ship a
      # stale UI rather than failing.
      - name: Build the frontend
        run: npm ci && npm run build

      - name: Build the release binary
        working-directory: src-tauri
        run: cargo +1.89 build --release --no-default-features --features custom-protocol

      # Renamed on upload so three same-named binaries can coexist on one release.
      - name: Stage the binary
        shell: bash
        run: |
          mkdir -p staging
          cp "src-tauri/target/release/${{ matrix.binary }}" "staging/${{ matrix.asset }}"
          ls -l staging

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.asset }}
          path: staging/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Attach binaries to the release
    needs: build
    # Only a tag produces a release; a dispatch run stops after building, which is
    # what makes it usable as a dry run.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -lR artifacts
          # Checksums so a download can be verified without trusting the transfer.
          ( cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt )
          # --clobber so re-running against an existing tag replaces assets
          # instead of failing halfway through.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            artifacts/* \
          || gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber artifacts/*

  # These binaries are CPU-only. The CUDA build needs a self-hosted GPU runner and
  # there is none attached, so it is deliberately absent rather than silently
  # producing a release that claims GPU support it was never built with. Build it
  # locally with scripts/check-cuda.sh and attach it by hand if wanted.
